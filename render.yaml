services:
- type: web
  name: cee-tender-intelligence-free
  runtime: docker
  plan: free
  healthCheckPath: /health
  envVars:
  - key: SECRET_KEY
    generateValue: true
  - key: ADMIN_EMAIL
    sync: false
  - key: ADMIN_PASSWORD
    sync: false
  - key: APP_LANGUAGE
    value: uk
  - key: CACHE_LIMIT
    value: 1000
