{% extends 'base.html' %}{% block content %}<h1>{{t.analytics}}</h1><form class="toolbar"><select name="countries" multiple>{% for c in countries %}<option value="{{c}}" {% if c in selected_countries %}selected{% endif %}>{{c}}</option>{% endfor %}</select><input type="date" name="date_from" value="{{date_from}}"><input type="date" name="date_to" value="{{date_to}}"><select name="categories" multiple>{% for c in ['SSD','DRAM','Flash','NAND','Other'] %}<option value="{{c}}" {% if c in selected_categories %}selected{% endif %}>{{c}}</option>{% endfor %}</select><button>{{t.filter}}</button></form><div class="table"><div class="thead"><span>{{t.winner}}</span><span>{{t.wins}}</span><span>{{t.total}}</span><span>{{t.market_share}}</span></div>{% for r in rows %}<a class="tr" href="/suppliers/{{r.winner|urlencode}}"><span>{{r.winner}}</span><span>{{r.wins}}</span><span>{{'%.2f'|format(r.total)}}</span><span>{{'%.1f'|format(r.share)}}%</span></a>{% else %}<p>{{t.no_winner}}</p>{% endfor %}</div>{% endblock %}
